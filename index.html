<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="시간표">
<meta name="theme-color" content="#000080">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>나의 주간 시간표</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Gothic+Coding:wght@400;700&display=swap">
<style>
  :root{
    --face:#c0c0c0; --hi:#ffffff; --lt:#dfdfdf; --sh:#808080; --dk:#0a0a0a;
    --bg:#ffffff; --panel:#c0c0c0; --line:#808080; --line2:#e4e4e4;
    --ink:#000000; --sub:#505050; --accent:#000080; --now:#d00000; --today:#ffffd8;
    --ok:#008000; --bad:#c00000;
    --raised:inset -1px -1px var(--dk),inset 1px 1px var(--hi),inset -2px -2px var(--sh),inset 2px 2px var(--lt);
    --pressed:inset -1px -1px var(--hi),inset 1px 1px var(--dk),inset -2px -2px var(--lt),inset 2px 2px var(--sh);
    --field:inset -1px -1px var(--hi),inset 1px 1px var(--sh),inset -2px -2px var(--lt),inset 2px 2px var(--dk);
    --rh:15px; --hh:36px; --tw:26px;
    --c0:#ff9a9a; --c0i:#000;  --c1:#ffd27a; --c1i:#000;
    --c2:#a6e3a1; --c2i:#000;  --c3:#9fd6e8; --c3i:#000;
    --c4:#a9b4f2; --c4i:#000;  --c5:#d9a9f0; --c5i:#000;
    --c6:#d8d8d8; --c6i:#000;  --c7:#8f8fd8; --c7i:#000;
    --c8:#f5a8cf; --c8i:#000;  --c9:#86d4c2; --c9i:#000;
    --c10:#d0d0d0; --c10i:#000; --c11:#e4e4e4; --c11i:#000;
  }
  @media (min-width:600px){ :root{--rh:17px;--tw:32px} }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:#008080;color:var(--ink);
    font-family:"Gulim","굴림","Nanum Gothic Coding","DotumChe",monospace;font-size:13px;-webkit-font-smoothing:none}
  button{font:inherit;color:inherit}
  .wrap{max-width:780px;margin:10px auto 52px;background:var(--face);box-shadow:var(--raised);padding:3px 3px 10px}
  header.titlebar{display:flex;align-items:center;gap:6px;height:24px;padding:0 3px 0 5px;margin-bottom:8px;
    background:linear-gradient(90deg,#000080,#1084d0);color:#fff}
  header.titlebar h1{font-size:13px;margin:0;flex:1;font-weight:700;letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ico{width:16px;height:14px;display:grid;grid-template-columns:1fr 1fr;gap:1px;flex:none}
  .ico i{display:block}.ico i:nth-child(1){background:#f00}.ico i:nth-child(2){background:#0a0}.ico i:nth-child(3){background:#00f}.ico i:nth-child(4){background:#ff0}
  .tbtns{display:flex;gap:2px}
  .tbtns b,.tbx{width:18px;height:16px;background:var(--face);box-shadow:var(--raised);color:#000;font-size:11px;
    display:flex;align-items:center;justify-content:center;font-weight:700;line-height:1;border:0;padding:0;cursor:pointer}
  .tbtns b:last-child{margin-left:2px}
  .inner{padding:0 6px}

  .seg{display:flex;gap:0;background:transparent;padding:0}
  .seg button{border:0;background:var(--face);box-shadow:var(--raised);color:#000;font-size:13px;padding:5px 10px;cursor:pointer;border-radius:0}
  .seg button.on{box-shadow:var(--pressed);background:#d4d4d4;font-weight:700}
  #viewSeg{gap:0;align-items:flex-end;border-bottom:2px solid var(--hi);margin-bottom:10px;position:relative}
  #viewSeg button{box-shadow:inset 1px 1px var(--hi),inset -1px 0 var(--dk),inset -2px 0 var(--sh),inset 2px 2px var(--lt);
    padding:6px 8px 5px;margin-right:-1px;position:relative;top:2px;background:var(--face)}
  #viewSeg button.on{padding:8px 8px 7px;top:2px;z-index:2;font-weight:700;background:var(--face);
    box-shadow:inset 1px 1px var(--hi),inset -1px 0 var(--dk),inset -2px 0 var(--sh),inset 2px 2px var(--lt)}
  .ctl{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 0 10px;flex-wrap:wrap}
  .wknav{display:flex;align-items:center;gap:4px;font-size:13px;font-weight:700}
  .wknav button{border:0;background:var(--face);box-shadow:var(--raised);font-size:13px;width:24px;height:22px;padding:0;cursor:pointer;color:#000}
  .wknav button:active{box-shadow:var(--pressed)}
  .wknav .thisw{width:auto;padding:0 8px;font-weight:400;margin-left:4px}
  .wknav span{background:var(--bg);box-shadow:var(--field);padding:4px 8px;min-width:120px;text-align:center}

  .card{background:var(--face);box-shadow:var(--raised);padding:3px;overflow:hidden}
  .mb{margin-bottom:10px}
  .card > h3,.tbar{margin:0;height:22px;display:flex;align-items:center;justify-content:space-between;padding:0 3px 0 6px;
    background:linear-gradient(90deg,#000080,#1084d0);color:#fff;font-size:12px;font-weight:700}
  .tbar h3{font-size:12px;margin:0;font-weight:700}
  .tbar .btn.sm{padding:1px 6px;font-size:11px;color:#000}
  .sunk{background:var(--bg);box-shadow:var(--field);margin:4px;padding:2px}

  /* now card */
  .now-card{display:flex;gap:10px;align-items:center;padding:10px}
  .now-card .nm{flex:1;min-width:0;background:var(--bg);box-shadow:var(--field);padding:8px 10px}
  .now-card .k{font-size:11px;color:var(--sub)}
  .now-card .big{font-size:18px;font-weight:700;margin:3px 0;display:flex;align-items:center;gap:8px}
  .now-card .big i{width:12px;height:12px;display:inline-block;flex:none;border:1px solid #000}
  .now-card .nx{font-size:12px;color:var(--sub)}
  .now-card .act{display:flex;flex-direction:column;gap:6px}

  /* week grid */
  #weekView .grid,#dayView > div{background:var(--bg);box-shadow:var(--field);padding:2px}
  .grid{display:grid;grid-template-columns:var(--tw) repeat(7,1fr);grid-template-rows:var(--hh) calc(var(--rh)*48)}
  .dh{display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;font-weight:700;
    background:var(--face);box-shadow:var(--raised);line-height:1.1}
  .dh small{font-size:10px;font-weight:400;color:var(--sub)}
  .dh.today{background:#000080;color:#fff;box-shadow:var(--pressed)} .dh.today small{color:#fff}
  .dh.sat{color:#0000c0}.dh.sun{color:#c00000}
  .dh.today,.dh.today.sat,.dh.today.sun{color:#fff}
  .tcol{position:relative;background:var(--face)}
  .tl{position:absolute;right:3px;font-size:10px;color:#000;transform:translateY(-1px)}
  .tl.mid{color:var(--now);font-weight:700}
  .dcol{position:relative;border-left:1px solid var(--sh);cursor:pointer;
    background-image:linear-gradient(#c8c8c8 1px,transparent 1px),linear-gradient(#ececec 1px,transparent 1px);
    background-size:100% calc(var(--rh)*2),100% var(--rh)}
  .dcol.today{background-color:var(--today)}
  .dcol .midline{position:absolute;left:0;right:0;border-top:1px dashed #000;opacity:.5;pointer-events:none}
  .blk{position:absolute;left:1px;right:1px;border:1px solid #000;padding:1px 2px;font-size:10.5px;line-height:1.15;
    overflow:hidden;word-break:keep-all;overflow-wrap:anywhere;z-index:2;box-shadow:inset 1px 1px rgba(255,255,255,.6)}
  .blk .bt{white-space:nowrap;overflow:hidden}
  .blk.L{right:50%;left:0}
  .blk.R{left:50%;right:0}
  .blk b{font-weight:700;display:block}
  .blk .bt{display:block;font-size:9px}
  .now{position:absolute;left:0;right:0;height:2px;background:var(--now);z-index:3;pointer-events:none}
  .now::before{content:"";position:absolute;left:-2px;top:-3px;width:0;height:0;border:4px solid transparent;border-left:6px solid var(--now)}
  .legend{font-size:11px;color:var(--sub);padding:6px 10px}

  /* day view */
  .daytabs{display:flex;gap:3px;padding:6px;background:var(--face)}
  .daytabs button{flex:1;min-width:0;border:0;background:var(--face);box-shadow:var(--raised);font-size:13px;padding:5px 0;cursor:pointer;line-height:1.15}
  .daytabs button small{display:block;font-size:10px;color:var(--sub)}
  .daytabs button.on{box-shadow:var(--pressed);background:#000080;color:#fff}
  .daytabs button.on small{color:#fff}
  #dayList{background:var(--bg)}
  .row{display:flex;align-items:center;gap:10px;padding:0 10px;min-height:34px;border-bottom:1px dotted #a0a0a0;cursor:pointer}
  .row .h{width:104px;flex:none;color:var(--sub);font-size:12px}
  .row .t{font-size:14px;flex:1;display:flex;align-items:center;gap:8px}
  .row .t i{width:10px;height:10px;flex:none;border:1px solid #000}
  .row .du{font-size:12px;color:var(--sub)}
  .row.gap .t{color:#909090;font-size:13px}
  .row.cur{background:#000080;color:#fff} .row.cur .h,.row.cur .du{color:#fff;font-weight:700}
  .dc{display:grid;grid-template-columns:44px 1fr 6px 1fr;column-gap:4px;padding:0 6px 6px;--rh:22px;background:var(--bg)}
  .dc .hd{font-size:12px;font-weight:700;text-align:center;padding:6px 0}
  .dc .dcol{border:1px solid var(--sh)}
  .dc .blk{font-size:12px;padding:2px 4px}
  .dc .blk .bt{font-size:10px}
  .strip{position:relative}
  .strip div{position:absolute;left:0;right:0}
  .dc .tl{font-size:11px}
  .dc .tcol{background:transparent}

  /* totals */
  .tot .rate{font-size:12px;padding:8px 8px 6px}
  .tot .rate b{font-size:15px}
  .trow{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;padding:6px 8px;align-items:center;background:var(--bg);border-bottom:1px dotted #b0b0b0}
  .trow .n{display:flex;align-items:center;gap:6px;font-size:13px;min-width:74px}
  .trow .n i{width:10px;height:10px;border:1px solid #000}
  .trow .nums.over{color:var(--bad);font-weight:700}
  .trow .nums{font-size:12px;color:var(--sub);text-align:right}
  .trow .bars{grid-column:1 / -1;position:relative;height:14px}
  .trow .bars .p{position:absolute;top:0;height:6px;opacity:1;border:1px solid #000;background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.75) 0 2px,transparent 2px 4px)!important}
  .trow .bars .a{position:absolute;top:8px;height:6px;border:1px solid #000}
  .tot .key{font-size:11px;color:var(--sub);padding:6px 8px}

  .bar{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap;margin:10px 0 0}
  .btn{border:0;background:var(--face);box-shadow:var(--raised);font-size:13px;padding:6px 12px;cursor:pointer;border-radius:0;color:#000}
  .btn:active{box-shadow:var(--pressed)}
  .btn.pri{font-weight:700;outline:1px solid #000;outline-offset:-1px;box-shadow:inset -2px -2px var(--dk),inset 2px 2px var(--hi),inset -3px -3px var(--sh),inset 3px 3px var(--lt)}
  .btn.warn{color:#a00000}
  .btn.sm{font-size:12px;padding:4px 9px}
  .emptybox{padding:10px;text-align:center;font-size:13px;display:flex;gap:6px;justify-content:center;flex-wrap:wrap;align-items:center}

  /* sheets as dialog windows */
  .scrim{position:fixed;inset:0;background:transparent;display:none;z-index:50}
  .scrim.on{display:block}
  .sheet{position:fixed;left:8px;right:8px;bottom:44px;background:var(--face);z-index:51;box-shadow:var(--raised),4px 4px 0 rgba(0,0,0,.35);
    padding:3px 10px 12px;max-width:520px;margin:0 auto;max-height:80vh;overflow-y:auto;
    display:none}
  .sheet.on{display:block}
  .sheet h2{font-size:12px;margin:0 -7px 8px;height:22px;display:flex;align-items:center;justify-content:space-between;padding:0 3px 0 6px;
    background:linear-gradient(90deg,#000080,#1084d0);color:#fff;font-weight:700;position:sticky;top:-3px;z-index:3}
  .lbl{font-size:12px;margin:10px 0 5px}
  .inp{width:100%;font:inherit;font-size:16px;padding:6px 8px;border:0;border-radius:0;background:var(--bg);color:#000;box-shadow:var(--field)}
  select.inp{-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,#000 50%),linear-gradient(135deg,#000 50%,transparent 50%);
    background-position:calc(100% - 13px) 50%,calc(100% - 8px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:24px}
  .chips{display:flex;flex-wrap:wrap;gap:4px}
  .chip{border:0;background:var(--face);box-shadow:var(--raised);font-size:13px;padding:5px 9px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;border-radius:0}
  .chip i{width:9px;height:9px;border:1px solid #000}
  .chip.on{box-shadow:var(--pressed);background:#000080;color:#fff}
  .sw{width:28px;height:28px;border:1px solid #000;cursor:pointer;border-radius:0;outline:2px solid transparent;outline-offset:1px}
  .sw.on{outline:2px dotted #000}
  .rng{display:flex;align-items:center;gap:6px}
  .wheel{position:relative;display:inline-block;flex:none;overflow:hidden}
  .wheel input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0}
  .actrow{display:flex;align-items:center;gap:10px;padding:6px 8px;background:var(--bg);border-bottom:1px dotted #a0a0a0}
  .actrow .an{flex:1;font-size:14px}
  #actList{box-shadow:var(--field);padding:2px;background:var(--bg)}
  .rng select{flex:1}
  .acts{display:flex;gap:8px;margin-top:14px}
  .acts .btn{flex:1;padding:8px}
  .tpl{background:var(--bg);box-shadow:var(--field);padding:8px;margin-bottom:6px}
  .tpl .top{display:flex;align-items:center;gap:6px}
  .tpl .top b{flex:1;font-size:13px}
  .mini{display:flex;height:10px;overflow:hidden;margin-top:6px;border:1px solid #000;background:#eee}
  .mini span{flex:1}
  .tpl .apply{margin-top:8px;display:none}
  .tpl.open .apply{display:block}
  .toast{position:fixed;left:50%;bottom:46px;transform:translateX(-50%);background:#ffffe1;color:#000;border:1px solid #000;
    padding:6px 10px;font-size:12px;opacity:0;transition:opacity .15s;z-index:60;pointer-events:none;max-width:90vw;text-align:center;box-shadow:2px 2px 0 rgba(0,0,0,.3)}
  .toast.on{opacity:1}

  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
  .stat{background:var(--bg);box-shadow:var(--field);padding:8px}
  .stat .k{font-size:11px;color:var(--sub)}
  .stat .v{font-size:19px;font-weight:700;margin-top:2px}
  .stat .v small{font-size:11px;font-weight:400;color:var(--sub)}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;padding:8px;background:var(--bg);box-shadow:var(--field);margin:4px}
  .cal .wd{font-size:11px;text-align:center;padding-bottom:2px;font-weight:700}
  .cal .dd{aspect-ratio:1/1;background:#ececec;position:relative;cursor:pointer;border:1px solid #a0a0a0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px}
  .cal .dd .pc{font-size:10px;font-weight:700}
  .cal .dd.blank{background:transparent;border-color:transparent;cursor:default}
  .cal .dd.today{outline:2px solid var(--now);outline-offset:-2px}
  .cal .dd.sel{outline:2px dotted #000;outline-offset:-3px}
  .cal .dd .mm{position:absolute;top:2px;right:2px;width:6px;height:6px;background:#000}
  .cal .dd.future{opacity:.5}
  .scale{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--sub);padding:4px 8px 6px}
  .scale span.b{width:14px;height:10px;border:1px solid #000}
  .chartbox{position:relative;padding:6px;background:var(--bg);box-shadow:var(--field);margin:4px}
  .chartbox svg{display:block;width:100%;height:auto;overflow:visible}
  .tip{position:absolute;pointer-events:none;background:#ffffe1;color:#000;border:1px solid #000;font-size:11px;padding:4px 6px;
    white-space:nowrap;transform:translate(-50%,-110%);display:none;z-index:5;line-height:1.4}
  .detail{padding:8px 10px;margin:4px;font-size:13px;background:var(--bg);box-shadow:var(--field)}
  .detail .dt{font-weight:700;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
  .detail .memo{background:#ffffe1;border:1px solid #808080;padding:6px 8px;margin-top:6px;white-space:pre-wrap;word-break:break-word}
  .goal{padding:10px;background:var(--bg);border-bottom:1px dotted #a0a0a0}
  .goal .top{display:flex;align-items:center;gap:8px;font-size:13px}
  .goal .top b{flex:1;font-weight:700;display:flex;align-items:center;gap:6px}
  .goal .top b i{width:10px;height:10px;border:1px solid #000}
  .goal.over .top span,.goal.over .sub{color:var(--bad);font-weight:700}
  .goal .sub{font-size:12px;color:var(--sub);margin-top:3px}
  .pbar{height:16px;background:var(--bg);box-shadow:var(--field);margin-top:6px;padding:2px;overflow:hidden}
  .pbar div{height:100%;background-image:repeating-linear-gradient(90deg,currentColor 0 9px,transparent 9px 11px)!important;color:#000080}
  .ms{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--bg);border-bottom:1px dotted #a0a0a0}
  .ms input[type=checkbox]{width:16px;height:16px;accent-color:#000;flex:none;margin:0}
  .ms .tt{flex:1;font-size:13px;min-width:0;word-break:break-word}
  .ms.done .tt{text-decoration:line-through;color:#808080}
  .ms .dday{font-size:12px;color:var(--sub);white-space:nowrap}
  .ms .dday.late{color:var(--bad);font-weight:700}
  .xbtn{border:0;background:var(--face);box-shadow:var(--raised);color:#000;font-size:11px;font-weight:700;cursor:pointer;width:18px;height:16px;padding:0;line-height:1}
  .xbtn:active{box-shadow:var(--pressed)}
  .form{padding:8px 4px 4px;display:flex;flex-direction:column;gap:6px}
  .form .r{display:flex;gap:6px}
  .form .inp{font-size:15px;padding:6px 8px}
  #memoList,#gList,#msList{margin:0 4px}
  .mgroup{padding:8px;background:#ffffe1;border:1px solid #808080;margin-bottom:4px}
  .mgroup .gd{font-size:11px;color:#404040;font-weight:700;margin-bottom:4px}
  .mitem{display:flex;gap:8px;align-items:flex-start;padding:3px 0}
  .mitem .tx{flex:1;font-size:13px;white-space:pre-wrap;word-break:break-word;line-height:1.5}
  .muted{font-size:12px;color:var(--sub);padding:8px}
  @media (max-width:420px){.stats{grid-template-columns:repeat(2,1fr)}}

  /* taskbar */
  .taskbar{position:fixed;left:0;right:0;bottom:0;height:36px;background:var(--face);box-shadow:inset 0 1px var(--lt),inset 0 2px var(--hi);
    display:flex;align-items:center;gap:4px;padding:3px 4px calc(3px + env(safe-area-inset-bottom));z-index:40}
  .start{display:flex;align-items:center;gap:5px;height:26px;padding:0 8px;font-weight:700;border:0;background:var(--face);box-shadow:var(--raised);cursor:pointer}
  .start.on{box-shadow:var(--pressed)}
  .task{flex:1;min-width:0;height:26px;display:flex;align-items:center;gap:6px;padding:0 8px;background:#d4d4d4;box-shadow:var(--pressed);font-size:12px;font-weight:700;overflow:hidden;white-space:nowrap}
  .clock{height:26px;display:flex;align-items:center;padding:0 10px;box-shadow:inset -1px -1px var(--hi),inset 1px 1px var(--sh);font-size:12px}
  .smenu{position:fixed;left:4px;bottom:36px;z-index:45;background:var(--face);box-shadow:var(--raised),3px 3px 0 rgba(0,0,0,.3);display:none;padding:3px 3px 3px 28px;min-width:190px}
  .smenu.on{display:block}
  .smenu::before{content:"시간표 95";position:absolute;left:3px;top:3px;bottom:3px;width:22px;background:linear-gradient(0deg,#000080,#1084d0);
    color:#c0c0c0;font-weight:700;writing-mode:vertical-rl;transform:rotate(180deg);font-size:13px;display:flex;align-items:center;justify-content:flex-end;padding-top:6px}
  .smenu button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:8px 10px;font-size:13px;cursor:pointer}
  .smenu button:hover,.smenu button:active{background:#000080;color:#fff}
  .smenu hr{border:0;border-top:1px solid var(--sh);border-bottom:1px solid var(--hi);margin:3px 0}
</style>
</head>
<body>
<div class="wrap">
  <header class="titlebar"><span class="ico"><i></i><i></i><i></i><i></i></span><h1>나의 주간 시간표</h1>
    <span class="tbtns"><b aria-hidden="true">_</b><b aria-hidden="true">□</b><b aria-hidden="true">×</b></span></header>
  <div class="inner">
  <div class="seg tabs5 mb" id="viewSeg" style="justify-content:space-between">

<script>
const DAYS=["월","화","수","목","금","토","일"];
const LS2="weekly-timetable-v2", LS1="weekly-timetable-v1";
const NC=10;
const FIXED={"업무":4,"공부":3,"창작":5,"운동":0,"게임":1,"식사":9,"배달":8,"취침":10,"이동":11};
const RENAME={"점심":"식사","저녁":"식사","아침":"식사","출근":"이동","퇴근":"이동","웹소설":"창작","블로그":"창작"};
const DEFAULTS=["업무","공부","창작","운동","게임","배달","식사","이동","취침"];
let S={v:2,weeks:{},colors:{},templates:{},goals:[],miles:[],memos:[],seed:0,acts:[]};
let mon="", selDay=null;
let wk="", view="week", mode="plan", dayIdx=0, edit=null, color=0;
const $=id=>document.getElementById(id);
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}

/* ---------- time ---------- */
function pad(n){return String(n).padStart(2,"0")}
function lab(s){if(s>=48)return "06:00";const h=(6+Math.floor(s/2))%24;return pad(h)+":"+(s%2?"30":"00")}
function endLab(s){return s>=48?"다음날 06:00":lab(s)}
function optLab(s){return lab(s)+(s>=36&&s<48?" (새벽)":"")}
function dur(n){const h=Math.floor(n/2);return n%2?(h?h+"시간 30분":"30분"):h+"시간"}
function hrs(n){return (n/2).toString().replace(/\.0$/,"")+"h"}
function dkey(dt){return dt.getFullYear()+"-"+pad(dt.getMonth()+1)+"-"+pad(dt.getDate())}
function parseKey(k){const[y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d)}
function mondayOf(dt){const d=new Date(dt.getFullYear(),dt.getMonth(),dt.getDate());d.setDate(d.getDate()-((d.getDay()+6)%7));return d}
function shiftWk(k,n){const d=parseKey(k);d.setDate(d.getDate()+7*n);return dkey(d)}
function lnow(){
  const n=new Date(),sh=new Date(n.getTime()-6*3600e3);
  const mins=sh.getHours()*60+sh.getMinutes();
  return {wk:dkey(mondayOf(sh)),d:(sh.getDay()+6)%7,s:Math.floor(mins/30),f:mins/30,t:pad(n.getHours())+":"+pad(n.getMinutes())};
}
function dayDate(k,d){const x=parseKey(k);x.setDate(x.getDate()+d);return x}

/* ---------- data ---------- */
function layer(w,l){return (S.weeks[w]&&S.weeks[w][l])||{}}
function ensure(w,l){S.weeks[w]=S.weeks[w]||{plan:{},actual:{}};S.weeks[w][l]=S.weeks[w][l]||{};return S.weeks[w][l]}
function k2(d,s){return d+"-"+s}
function blocks(cells,d){
  const out=[];let s=0;
  while(s<48){const v=cells[k2(d,s)];if(!v){s++;continue}
    let e=s+1;while(e<48&&cells[k2(d,e)]===v)e++;
    out.push({d,s,e,t:v});s=e;}
  return out;
}
function hash(t){let h=0;for(const c of t)h=(h*31+c.charCodeAt(0))|0;return Math.abs(h)}
const PAL=["#ff9a9a","#ffd27a","#a6e3a1","#9fd6e8","#a9b4f2","#d9a9f0","#d8d8d8","#8f8fd8","#f5a8cf","#86d4c2","#d0d0d0","#e4e4e4"];
function hexOf(c){return typeof c==="string"?c:PAL[c]||"#cccccc"}
function colorOf(t){
  if(S.colors[t]!=null)return S.colors[t];
  if(FIXED[t]!=null)return FIXED[t];
  if(S.colors[t]==null){const used=new Set([...Object.values(S.colors),...Object.values(FIXED)]);let c=-1;
    for(let i=0;i<NC;i++)if(!used.has(i)){c=i;break}
    S.colors[t]=c<0?hash(t)%NC:c;}
  return S.colors[t];
}
function cv(c){return typeof c==="string"?c:`var(--c${c})`}
function ci(c){if(typeof c!=="string")return `var(--c${c}i)`;const n=parseInt(c.slice(1),16),r=n>>16,g=(n>>8)&255,b=n&255;return (0.299*r+0.587*g+0.114*b)>140?"#000":"#fff"}
function names(){
  const seen=new Set(S.acts);
  for(const w of Object.values(S.weeks))for(const l of ["plan","actual"])for(const v of Object.values(w[l]||{}))seen.add(v);
  for(const t of Object.values(S.templates))for(const v of Object.values(t))seen.add(v);
  for(const d of DEFAULTS)seen.add(d);
  return [...seen].slice(0,16);
}

/* ---------- render ---------- */
function render(){
  const N=lnow();
  const ww=view==="week"||view==="day";
  $("wkCtl").style.display=ww?"":"none";$("totals").style.display=ww?"":"none";
  $("monthView").style.display=view==="month"?"":"none";
  $("goalsView").style.display=view==="goals"?"":"none";
  for(const id of ["tplBtn","copyBtn","clearBtn"])$(id).style.display=ww?"":"none";
  if(!ww){$("nowCard").style.display="none";$("emptyHint").style.display="none";$("weekView").style.display="none";$("dayView").style.display="none";
    renderMemos();if(view==="month")renderMonth();else renderGoals();return}
  $("wkLabel").textContent=wkLabel(wk);
  $("thisW").style.display=wk===N.wk?"none":"";
  $("weekView").style.display=view==="week"?"":"none";
  $("dayView").style.display=view==="day"?"":"none";
  $("clearBtn").textContent=mode==="plan"?"이 주 계획 비우기":mode==="actual"?"이 주 기록 비우기":"이 주 전부 비우기";
  renderMemos();renderNow();renderEmpty();
  if(view==="week")renderWeek();else renderDay();
  renderTotals();
}
function wkLabel(k){const a=parseKey(k),b=dayDate(k,6);
  return `${a.getMonth()+1}월 ${a.getDate()}일 – ${a.getMonth()===b.getMonth()?"":(b.getMonth()+1)+"월 "}${b.getDate()}일`}

function blockEl(b,side,full){
  const e=el("div","blk"+(side?" "+side:""));
  e.style.top=`calc(var(--rh) * ${b.s} + 1px)`;e.style.height=`calc(var(--rh) * ${b.e-b.s} - 2px)`;
  const c=colorOf(b.t);e.style.background=cv(c);e.style.color=ci(c);
  if(full){
    if(b.e-b.s>=2)e.appendChild(el("span","bt",lab(b.s)));
    e.appendChild(el("b",null,b.t));
  }
  e.title=`${lab(b.s)}–${endLab(b.e)} ${b.t}`;
  return e;
}
function timeCol(){
  const tc=el("div","tcol");
  for(let i=0;i<24;i++){const h=(6+i)%24;const t=el("div","tl"+(h===0?" mid":""),h===0?"0시":h);
    t.style.top=`calc(var(--rh) * ${i*2})`;tc.appendChild(t)}
  return tc;
}
function slotFrom(col,ev){const r=col.getBoundingClientRect();return Math.max(0,Math.min(47,Math.floor((ev.clientY-r.top)/(r.height/48))))}
function midline(){const m=el("div","midline");m.style.top=`calc(var(--rh) * 36)`;return m}

function renderWeek(){
  const g=$("grid");g.innerHTML="";
  const N=lnow(),isCur=N.wk===wk;
  g.appendChild(el("div","dh"));
  DAYS.forEach((n,i)=>{const dt=dayDate(wk,i);
    const e=el("div","dh"+(isCur&&i===N.d?" today":"")+(i===5?" sat":"")+(i===6?" sun":""));
    e.appendChild(el("span",null,n));e.appendChild(el("small",null,dt.getDate()));g.appendChild(e)});
  g.appendChild(timeCol());
  for(let d=0;d<7;d++){
    const c=el("div","dcol"+(isCur&&d===N.d?" today":""));
    c.appendChild(midline());
    c.onclick=ev=>{
      if(mode==="cmp"){dayIdx=d;setView("day");return}
      const s=slotFrom(c,ev);openEdit({layer:mode,days:[d],start:s,end:Math.min(48,s+2)});
    };
    const ls=mode==="cmp"?[["plan","L"],["actual","R"]]:[[mode,""]];
    for(const [l,side] of ls)for(const b of blocks(layer(wk,l),d)){
      const e=blockEl(b,side,mode!=="cmp");
      if(mode!=="cmp")e.onclick=ev=>{ev.stopPropagation();openEdit({layer:mode,days:[d],start:b.s,end:b.e,name:b.t,orig:{d,s:b.s,e:b.e}})};
      c.appendChild(e);
    }
    if(isCur&&d===N.d){const ln=el("div","now");ln.style.top=`calc(var(--rh) * ${N.f})`;c.appendChild(ln)}
    g.appendChild(c);
  }
}

function renderDayTabs(){
  const tabs=$("dayTabs");tabs.innerHTML="";const N=lnow();
  DAYS.forEach((n,i)=>{const b=el("button",i===dayIdx?"on":"");b.appendChild(document.createTextNode(n));
    const sm=el("small",null,dayDate(wk,i).getDate()+(wk===N.wk&&i===N.d?" 오늘":""));b.appendChild(sm);
    b.onclick=()=>{dayIdx=i;renderDay()};tabs.appendChild(b)});
}
function renderDay(){
  renderDayTabs();
  const list=$("dayList");list.innerHTML="";
  if(mode==="cmp"){renderDayCmp(list);return}
  const cells=layer(wk,mode),bl=blocks(cells,dayIdx);
  const segs=[];let s=0;for(const b of bl){if(b.s>s)segs.push({s,e:b.s});segs.push(b);s=b.e}if(s<48)segs.push({s,e:48});
  const N=lnow(),cur=N.wk===wk&&N.d===dayIdx;
  for(const g of segs){
    const r=el("div","row"+(g.t?"":" gap")+(cur&&N.s>=g.s&&N.s<g.e?" cur":""));
    r.appendChild(el("span","h",`${lab(g.s)} – ${endLab(g.e)}`));
    const t=el("span","t");
    if(g.t){const i=el("i");i.style.background=cv(colorOf(g.t));t.appendChild(i);t.appendChild(document.createTextNode(g.t))}
    else t.textContent="비어 있음";
    r.appendChild(t);r.appendChild(el("span","du",dur(g.e-g.s)));
    r.onclick=()=>g.t?openEdit({layer:mode,days:[dayIdx],start:g.s,end:g.e,name:g.t,orig:{d:dayIdx,s:g.s,e:g.e}})
                     :openEdit({layer:mode,days:[dayIdx],start:g.s,end:Math.min(g.e,g.s+2)});
    list.appendChild(r);
  }
}
function renderDayCmp(list){
  const w=el("div","dc");
  w.appendChild(el("div","hd",""));w.appendChild(el("div","hd","계획"));w.appendChild(el("div","hd",""));w.appendChild(el("div","hd","실제"));
  w.appendChild(timeCol());
  const N=lnow(),cur=N.wk===wk&&N.d===dayIdx;
  const mk=l=>{const c=el("div","dcol"+(cur?" today":""));c.style.height="calc(var(--rh) * 48)";c.appendChild(midline());
    c.onclick=ev=>{const s=slotFrom(c,ev);const pn=layer(wk,"plan")[k2(dayIdx,s)];
      openEdit({layer:l,days:[dayIdx],start:s,end:Math.min(48,s+2),name:l==="actual"&&pn?pn:""})};
    for(const b of blocks(layer(wk,l),dayIdx)){const e=blockEl(b,"",true);
      e.onclick=ev=>{ev.stopPropagation();openEdit({layer:l,days:[dayIdx],start:b.s,end:b.e,name:b.t,orig:{d:dayIdx,s:b.s,e:b.e}})};c.appendChild(e)}
    if(cur){const ln=el("div","now");ln.style.top=`calc(var(--rh) * ${N.f})`;c.appendChild(ln)}
    return c};
  w.appendChild(mk("plan"));
  const st=el("div","strip");const p=layer(wk,"plan"),a=layer(wk,"actual");
  for(let s=0;s<48;s++){const pv=p[k2(dayIdx,s)],av=a[k2(dayIdx,s)];if(!pv||!av)continue;
    const x=el("div");x.style.top=`calc(var(--rh) * ${s})`;x.style.height="var(--rh)";
    x.style.background=pv===av?"var(--ok)":"var(--bad)";x.title=pv===av?"계획대로":"계획과 다름";st.appendChild(x)}
  w.appendChild(st);
  w.appendChild(mk("actual"));
  list.appendChild(w);
}

function renderNow(){
  const N=lnow(),box=$("nowCard");box.innerHTML="";
  if(N.wk!==wk){box.style.display="none";return}
  box.style.display="";box.className="card mb now-card";
  const p=layer(wk,"plan"),a=layer(wk,"actual");
  const bl=blocks(p,N.d),cb=bl.find(b=>N.s>=b.s&&N.s<b.e),nb=bl.find(b=>b.s>N.s);
  const nm=el("div","nm");
  nm.appendChild(el("div","k",`지금 ${N.t} · ${DAYS[N.d]}요일 계획`));
  const big=el("div","big");
  if(cb){const i=el("i");i.style.background=cv(colorOf(cb.t));big.appendChild(i);big.appendChild(document.createTextNode(cb.t));
    big.appendChild(el("span","nx",`~ ${endLab(cb.e)}`))}
  else big.appendChild(document.createTextNode("계획 없음"));
  nm.appendChild(big);
  const av=a[k2(N.d,N.s)];
  nm.appendChild(el("div","nx",(nb?`다음: ${lab(nb.s)} ${nb.t}`:"오늘 남은 계획 없음")+(av?` · 실제 기록: ${av}`:"")));
  box.appendChild(nm);
  const act=el("div","act");
  let miss=0;for(let s=0;s<N.s;s++){const k=k2(N.d,s);if(p[k]&&!a[k])miss++}
  if(miss){const b=el("button","btn sm pri",`지금까지 계획대로 했어요`);b.onclick=()=>{

function uid(){return Math.random().toString(36).slice(2,10)}
function todayKey(){return dkey(new Date(Date.now()-6*3600e3))}
function locOf(dt){return {wk:dkey(mondayOf(dt)),d:(dt.getDay()+6)%7}}
function dayStats(dt){ // past slots only
  const N=lnow(),{wk:w,d}=locOf(dt),p=layer(w,"plan"),a=layer(w,"actual");
  const key=dkey(dt),tk=todayKey();
  if(key>tk)return {future:true};
  const lim=key===tk?N.s:48;let planned=0,matched=0,recorded=0;
  for(let s=0;s<48;s++){const k=k2(d,s);if(a[k])recorded++;if(s>=lim)continue;if(p[k]){planned++;if(a[k]===p[k])matched++}}
  return {planned,matched,recorded,rate:recorded&&planned?matched/planned:null};
}
function monthDays(mk){const[y,m]=mk.split("-").map(Number);const n=new Date(y,m,0).getDate();const out=[];for(let i=1;i<=n;i++)out.push(new Date(y,m-1,i));return out}

function drawLine(days,st){

  const NS="http://www.w3.org/2000/svg",svg=document.createElementNS(NS,"svg");svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
  const add=(tag,at)=>{const e=document.createElementNS(NS,tag);for(const k in at)e.setAttribute(k,at[k]);svg.appendChild(e);return e};
  for(const r of[0,.5,1]){add("line",{x1:L,x2:W-Rr,y1:Y(r),y2:Y(r),stroke:"var(--line2)","stroke-width":1});
    const t=add("text",{x:L-6,y:Y(r)+4,"text-anchor":"end","font-size":11,fill:"var(--sub)"});t.textContent=Math.round(r*100)+"%"}
  for(const i of[0,9,19,n-1]){if(i>=n)continue;const t=add("text",{x:X(i),y:H-6,"text-anchor":"middle","font-size":11,fill:"var(--sub)"});t.textContent=(i+1)+"일"}
  add("path",{d:pts.map((p,k)=>(k?"L":"M")+X(p.i)+" "+Y(p.r)).join(" "),fill:"none",stroke:"var(--accent)","stroke-width":2,"stroke-linejoin":"round","stroke-linecap":"round"});
  const dots=pts.map(p=>add("circle",{cx:X(p.i),cy:Y(p.r),r:4,fill:"var(--accent)",stroke:"var(--panel)","stroke-width":2}));
  const cross=add("line",{y1:T,y2:H-B,stroke:"var(--sub)","stroke-width":1,"stroke-dasharray":"3 3",opacity:0});
  const hit=add("rect",{x:L,y:0,width:W-L-Rr,height:H,fill:"transparent"});
  const show=ev=>{const bb=svg.getBoundingClientRect();const sx=(ev.clientX-bb.left)/bb.width*W;
    let best=pts[0];for(const p of pts)if(Math.abs(X(p.i)-sx)<Math.abs(X(best.i)-sx))best=p;
    cross.setAttribute("x1",X(best.i));cross.setAttribute("x2",X(best.i));cross.setAttribute("opacity",.6);
    dots.forEach((d,k)=>d.setAttribute("r",pts[k]===best?6:4));
    const dt=days[best.i];tip.innerHTML="";tip.appendChild(el("div",null,`${dt.getMonth()+1}/${dt.getDate()} ${DAYS[(dt.getDay()+6)%7]}`));
    const b=el("b",null,Math.round(best.r*100)+"%");tip.appendChild(b);tip.appendChild(document.createTextNode(` · ${hrs(best.x.matched)}/${hrs(best.x.planned)}`));
    tip.style.left=(X(best.i)/W*bb.width+10)+"px";tip.style.top=(Y(best.r)/H*bb.height)+"px";tip.style.display="block"};
  const hide=()=>{tip.style.display="none";cross.setAttribute("opacity",0);dots.forEach(d=>d.setAttribute("r",4))};
  hit.addEventListener("pointermove",show);hit.addEventListener("pointerdown",show);hit.addEventListener("pointerleave",hide);
  box.insertBefore(svg,tip);
}

/* ---------- goals ---------- */
function goalProgress(){
  const tk=parseKey(todayKey());
  return S.goals.map(g=>{
    let dates=[];
    if(g.period==="week"){const m=mondayOf(tk);for(let i=0;i<7;i++){const d=new Date(m);d.setDate(m.getDate()+i);dates.push(d)}}
    else dates=monthDays(todayKey().slice(0,7));
    let a=0,p=0;for(const dt of dates){const{wk:w,d}=locOf(dt);const A=layer(w,"actual"),P=layer(w,"plan");
      for(let s=0;s<48;s++){if(A[k2(d,s)]===g.name)a++;if(P[k2(d,s)]===g.name)p++}}
    const max=g.kind==="max";return {...g,a,p,max,over:max&&a/2>g.target,done:max?a/2<=g.target:a/2>=g.target};
  });
}
function fillNames(){const dl=$("nameList");dl.innerHTML="";for(const n of names()){const o=document.createElement("option");o.value=n;dl.appendChild(o)}}
function renderGoals(){
  fillNames();
  const gl=$("gList");gl.innerHTML="";
  const gp=goalProgress();
  if(!gp.length)gl.appendChild(el("div","muted","목표 없음"));
  for(const g of gp){const c=el("div","goal"+(g.over?" over":"")),top=el("div","top"),b=el("b"),i=el("i");
    i.style.background=cv(colorOf(g.name));b.appendChild(i);b.appendChild(document.createTextNode(`${g.period==="week"?"이번 주":"이번 달"} ${g.name} ${g.target}시간 ${g.max?"이하":"이상"}`));top.appendChild(b);
    top.appendChild(el("span",null,g.max?(g.over?`⚠ 초과 +${hrs(g.a-g.target*2)}`:`남은 ${hrs(g.target*2-g.a)}`):(g.done?"✓ 달성":Math.round(Math.min(1,g.a/2/g.target)*100)+"%")));
    const x=el("button","xbtn","×");x.setAttribute("aria-label","삭제");x.onclick=()=>{S.goals=S.goals.filter(z=>z.id!==g.id);save();render()};top.appendChild(x);
    c.appendChild(top);c.appendChild(el("div","sub",`실제 ${hrs(g.a)} / ${g.max?"상한":"목표"} ${g.target}h · 계획 ${hrs(g.p)}`+(g.max&&!g.over&&g.p/2>g.target?" · 계획부터 상한 초과":"")));
    const pb=el("div","pbar"),f=el("div");f.style.width=Math.min(100,g.a/2/g.target*100)+"%";f.style.color=g.max?(g.over?"var(--bad)":(g.a/2>=g.target*.8?"#c07000":"#000080")):(g.done?"var(--ok)":"#000080");pb.appendChild(f);c.appendChild(pb);gl.appendChild(c)}
  const ml=$("msList");ml.innerHTML="";
  if(!S.miles.length)ml.appendChild(el("div","muted","달성 목표 없음"));
  const tk=todayKey();
  const sorted=[...S.miles].sort((a,b)=>(a.done-b.done)||((a.due||"9999")<(b.due||"9999")?-1:1));
  for(const m of sorted){const r=el("label","ms"+(m.done?" done":""));
    const cb=document.createElement("input");cb.type="checkbox";cb.checked=m.done;cb.onchange=()=>{m.done=cb.checked;save();render()};r.appendChild(cb);
    r.appendChild(el("span","tt",m.title));
    if(m.due){const diff=Math.round((parseKey(m.due)-parseKey(tk))/864e5);
      const dd=el("span","dday"+(!m.done&&diff<0?" late":""),m.done?`${+m.due.slice(5,7)}/${+m.due.slice(8)}`:diff===0?"D-day":diff>0?`D-${diff}`:`D+${-diff}`);r.appendChild(dd)}
    const x=el("button","xbtn","×");x.setAttribute("aria-label","삭제");x.onclick=ev=>{ev.preventDefault();S.miles=S.miles.filter(z=>z.id!==m.id);save();render()};r.appendChild(x);
    ml.appendChild(r)}
}

function tplFrom(spec){const t={};for(const[a,b,n]of spec)for(let s=a;s<b;s++)t[s]=n;return t}
const T_A=[[0,3,"취침"],[3,4,"식사"],[4,6,"이동"],[6,12,"업무"],[12,14,"식사"],[14,24,"업무"],[24,26,"이동"],[26,28,"식사"],[28,31,"공부"],[31,33,"운동"],[33,35,"창작"],[35,37,"게임"],[37,48,"취침"]];
const T_B=[[0,3,"취침"],[3,4,"식사"],[4,6,"이동"],[6,12,"업무"],[12,14,"식사"],[14,24,"업무"],[24,26,"이동"],[26,28,"식사"],[28,31,"공부"],[31,35,"창작"],[35,37,"게임"],[37,48,"취침"]];
const T_W=[[0,6,"취침"],[6,8,"식사"],[8,10,"공부"],[10,15,"배달"],[15,17,"식사"],[17,21,"공부"],[21,23,"창작"],[23,27,"배달"],[27,29,"식사"],[29,33,"창작"],[33,36,"게임"],[36,48,"취침"]];
function migrate(){
  const ren=c=>{for(const k in c)if(RENAME[c[k]])c[k]=RENAME[c[k]]};
  for(const w of Object.values(S.weeks)){ren(w.plan||{});ren(w.actual||{})}
  for(const t of Object.values(S.templates))ren(t);
  for(const g of S.goals)if(RENAME[g.name])g.name=RENAME[g.name];
  if(S.seed<1){
    S.templates["평일A (운동)"]=tplFrom(T_A);S.templates["평일B (창작)"]=tplFrom(T_B);S.templates["주말 (배달)"]=tplFrom(T_W);
    const add=(name,target,kind)=>{if(!S.goals.some(g=>g.name===name&&g.period==="week"))S.goals.push({id:uid(),name,target,period:"week",kind})};
    add("공부",10,"min");add("창작",8,"min");add("운동",3,"min");add("게임",8,"max");
    for(const t of["배달 안전교육 이수","자전거 혼자 30분 타기","자전거 배달 첫 운행"])if(!S.miles.some(m=>m.title===t))S.miles.push({id:uid(),title:t,due:"",done:false});
    const N=lnow();if(!Object.keys(layer(N.wk,"plan")).length)applyWeek(N.wk);
    S.seed=1;save();
  }
  if(S.seed<2){if(!S.acts.length)S.acts=[...DEFAULTS];if(S.colors["공부"]===2)delete S.colors["공부"];S.seed=2;save()}
}
function applyWeek(w){const L=ensure(w,"plan");for(let d=0;d<7;d++){const sp=d<5?([0,2,4].includes(d)?T_A:T_B):T_W;for(const[a,b,n]of sp)for(let s=a;s<b;s++)L[k2(d,s)]=n}}
function seed(){applyWeek(wk);save();render();return;
  const L=ensure(wk,"plan");
  const wkd=[[0,4,"취침"],[4,6,"출근"],[6,12,"업무"],[12,14,"점심"],[14,24,"업무"],[24,26,"퇴근"],[26,28,"저녁"],[28,34,"자유"],[34,48,"취침"]];
  const wke=[[0,6,"취침"],[34,48,"취침"]];
  for(let d=0;d<7;d++)for(const[s,e,t]of(d<5?wkd:wke))for(let x=s;x<e;x++)L[k2(d,x)]=t;
  save();render();
}

function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("on"),2000)}

/* ---------- storage (this device only) ---------- */
function clean(o){
  const out={v:2,weeks:{},colors:{},templates:{},goals:[],miles:[],memos:[],seed:0,acts:[]};
  const str=v=>typeof v==="string"&&v.length&&v.length<=30;
  const cells=c=>{const r={};if(c&&typeof c==="object")for(const[k,v]of Object.entries(c))if(/^[0-6]-([0-9]|[1-3][0-9]|4[0-7])$/.test(k)&&str(v))r[k]=v;return r};
  if(o&&typeof o==="object"){
    if(o.weeks&&typeof o.weeks==="object")for(const[k,w]of Object.entries(o.weeks))if(/^\d{4}-\d{2}-\d{2}$/.test(k)&&w)out.weeks[k]={plan:cells(w.plan),actual:cells(w.actual)};
    if(o.colors&&typeof o.colors==="object")for(const[k,v]of Object.entries(o.colors))if(str(k)&&((Number.isInteger(v)&&v>=0&&v<12)||(typeof v==="string"&&/^#[0-9a-fA-F]{6}$/.test(v))))out.colors[k]=v;
    if(o.templates&&typeof o.templates==="object")for(const[k,t]of Object.entries(o.templates)){if(!str(k)||!t||typeof t!=="object")continue;
      const r={};for(const[s,v]of Object.entries(t))if(/^([0-9]|[1-3][0-9]|4[0-7])$/.test(s)&&str(v))r[s]=v;out.templates[k]=r}
    out.seed=Number.isInteger(o.seed)?o.seed:0;
    if(Array.isArray(o.acts))for(const a of o.acts.slice(0,60))if(str(a)&&!out.acts.includes(a))out.acts.push(a);
    const id=v=>typeof v==="string"&&/^[a-z0-9]{1,20}$/.test(v);
    const date=v=>typeof v==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(v);
    if(Array.isArray(o.goals))for(const g of o.goals.slice(0,50))if(g&&id(g.id)&&str(g.name)&&typeof g.target==="number"&&g.target>0&&g.target<=500&&(g.period==="week"||g.period==="month"))out.goals.push({id:g.id,name:g.name,target:g.target,period:g.period,kind:g.kind==="max"?"max":"min"});
    if(Array.isArray(o.miles))for(const m of o.miles.slice(0,200))if(m&&id(m.id)&&typeof m.title==="string"&&m.title.length&&m.title.length<=80&&(m.due===""||date(m.due)))out.miles.push({id:m.id,title:m.title,due:m.due,done:!!m.done});
    if(Array.isArray(o.memos))for(const m of o.memos.slice(0,2000))if(m&&id(m.id)&&date(m.date)&&typeof m.text==="string"&&m.text.length&&m.text.length<=2000)out.memos.push({id:m.id,date:m.date,text:m.text,ts:Number(m.ts)||0});
  }
  return out;
}
function fromV1(cells1){ // {"d-h":{t,c}} hourly, midnight-based -> this week's plan
  const N=lnow();const o={v:2,weeks:{[N.wk]:{plan:{},actual:{}}},colors:{},templates:{},goals:[],miles:[],memos:[],seed:0};const P=o.weeks[N.wk].plan;
  for(const[k,v]of Object.entries(cells1||{})){const m=/^([0-6])-(\d{1,2})$/.exec(k);if(!m||!v||typeof v.t!=="string")continue;
    let d=+m[1],h=+m[2];if(h>23)continue;let s;if(h>=6)s=(h-6)*2;else{d=(d+6)%7;s=36+h*2}
    P[k2(d,s)]=v.t.slice(0,30);P[k2(d,s+1)]=v.t.slice(0,30);if(Number.isInteger(v.c)&&o.colors[v.t]==null)o.colors[v.t]=v.c%NC}
  return o;
}
function save(){try{localStorage.setItem(LS2,JSON.stringify(S));setStatus("이 기기에 저장됨")}catch{setStatus("이 브라우저는 저장을 막고 있어요 · 백업을 복사해 두세요")}}
let warned=false;function setStatus(m){if(m.includes("막고")&&!warned){warned=true;toast(m)}}
function load(){
  try{const r=localStorage.getItem(LS2);if(r){S=clean(JSON.parse(r));return true}}catch{}
  try{const r=localStorage.getItem(LS1);if(r){const o=JSON.parse(r);if(o&&o.cells){S=clean(fromV1(o.cells));save();return true}}}catch{}
  return false;
}

  try{await navigator.clipboard.writeText("TT2:"+JSON.stringify(S));toast("백업 코드를 복사했어요. 메모 앱 등에 붙여넣어 두세요")}catch{toast("복사가 막혀 있어요")}
};
$("restoreBtn").onclick=()=>{$("restoreTxt").value="";openS("restoreSheet")};
$("restoreOk").onclick=()=>{
  let t=$("restoreTxt").value.trim();
  try{
    if(t.startsWith("TT2:"))S=clean(JSON.parse(t.slice(4)));
    else if(t.startsWith("TT1:"))S=clean(fromV1(JSON.parse(t.slice(4))));
    else throw 0;
    migrate();save();closeS();render();toast("불러왔어요");
  }catch{toast("백업 코드가 올바르지 않아요")}
};

{const N=lnow();wk=N.wk;dayIdx=N.d;mon=todayKey().slice(0,7)}

setStatus(had?"이 기기에 저장됨":"이 기기에만 저장돼요");
